name: Custom snake

# 100% custom-built snake - no Platane, no third-party service.
# Regenerates assets/snake-dark.svg from the live contributions calendar.
on:
  schedule:
    - cron: "0 0 * * 0" # weekly, Sunday midnight
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "snake/**"
      - ".github/workflows/snake.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate custom snake
        run: python3 snake/generate.py

      - name: Commit refreshed snake
        run: |
          git config user.name "bdblackhathacker-snake"
          git config user.email "bdblackhathacker@users.noreply.github.com"
          git add assets/snake-dark.svg
          git diff --cached --quiet || git commit -m "chore: refresh custom contribution snake"
          git push
